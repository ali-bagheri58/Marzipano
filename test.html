<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Image Test</title>
    <link rel="stylesheet" href="/test.css" />
  </head>
  <body>
    <main class="test-shell">
      <header class="test-header">
        <div>
          <p class="eyebrow">Standalone image test</p>
          <h1>Display an Image on a 3D Sphere</h1>
        </div>
        <button id="open-image" type="button">Open 3D Image</button>
        <input id="image-input" type="file" accept="image/*" hidden />
      </header>
      <section class="viewer-panel">
        <div id="viewer" aria-label="3D image viewer"></div>
        <div id="empty-state">Choose an image to get started</div>
        <p class="viewer-hint">Drag to rotate · Scroll to zoom</p>
      </section>
      <p id="image-name" class="image-name">تصویر پیش‌فرض آماده است</p>
    </main>
    <script type="module" src="/test.js"></script>
  </body>
</html>
